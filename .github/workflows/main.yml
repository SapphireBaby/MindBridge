
name: MindBridge Build Test

on:
  push:
    branches: [main, mindbridge-v2]
  pull_request:
    branches: [main, mindbridge-v2]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build MindBridge
        run: npm run build
